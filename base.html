<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game.fun</title>
    <link rel="stylesheet" href="base.css">
    <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Playfair+Display:ital,wght@1,400&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        
        <div class="logo"><img src="logo.png" alt="Game.fun"></div>
    </header>

    <main>
        <h1 class="page-title">Choose a game</h1>

        <div class="game-container">
            <div class="game-card" onclick="playGame('Coloring')">
                <div class="circle-img coloring-bg">
                    <img src="color.jpg" alt="Coloring Game">
                </div>
                <a class="coloring" href="http://127.0.0.1:3000/coloring.html?serverWindowId=d9d0a4c2-807e-4f62-b45f-c2a7206f8eba">Drawing game</a>
            </div>

            <div class="game-card" onclick="playGame('Snake')">
                <div class="circle-img snake-bg">
                    <img src="snake game.jpg" alt="Snake Game">
                                </div>
                                <a class="snake" href="http://127.0.0.1:3000/snake.html?serverWindowId=2d0af3e7-8a3b-403d-82f6-010c0226f1ce">Snake game</a>
 
            </div>

            <div class="game-card" onclick="playGame('Car')">
                <div class="circle-img car-bg">
                    <img src="car.png" alt="Car Game">
                </div>
            <a class="car" href="http://127.0.0.1:3000/car.html?serverWindowId=5a4b6c7d-8e9f-0123-4567-89abcdef1234">Car game</a>
            </div>
        </div>
    <div class="upload-section">
    <h3>Add a New Game</h3>
    <input type="text" id="newGameName" placeholder="Game Name">
    <input type="file" id="newGameImage" accept="image/*">
    <button onclick="addNewGame()">Upload & Add</button>
</div>
    </main>

    <script>
        function playGame(gameName) {
            const title = document.querySelector('.page-title');
            title.innerText = "Loading " + gameName + "...";
            
            // Interactive feedback
            console.log("Starting " + gameName + "...");
            
        }
        function clearCanvas() {
    const canvas = document.getElementById('colorCanvas');
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
   
}
function addNewGame() {
    const name = document.getElementById('newGameName').value;
    const imageFile = document.getElementById('newGameImage').files[0];
    const container = document.querySelector('.game-container');

    if (!name || !imageFile) {
        alert("Please provide a name and an image.");
        return;
    }

    const reader = new FileReader();
    reader.onload = function(e) {
        const newCard = document.createElement('div');
        newCard.classList.add('game-card');
        newCard.onclick = () => playGame(name);

        newCard.innerHTML = `
            <div class="circle-img" style="background-color: #ddd;">
                <img src="${e.target.result}" alt="${name}">
            </div>
            <p>${name} game</p>
        `;

        container.appendChild(newCard);
        
        document.getElementById('newGameName').value = '';
        document.getElementById('newGameImage').value = '';
    };

    reader.readAsDataURL(imageFile);
}

    </script>
</body>
</html>
